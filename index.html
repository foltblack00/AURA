<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA - Személyes Asszisztens</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1e29 0%, #0a0c10 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0,242,254,0.5);
        }
        .settings-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .settings-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #00f2fe;
        }
        .visualizer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .aura-orb {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.8), 0 0 60px rgba(79, 172, 254, 0.4);
            animation: pulse 3s infinite ease-in-out;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .aura-orb.listening {
            animation: pulse-fast 1.2s infinite ease-in-out;
            box-shadow: 0 0 40px rgba(0, 242, 254, 1), 0 0 80px rgba(79, 172, 254, 0.8);
        }
        .aura-orb.speaking {
            animation: pulse-speaking 0.8s infinite ease-in-out;
            background: radial-gradient(circle, #ff0844 0%, #ffb199 100%);
            box-shadow: 0 0 40px rgba(255, 8, 68, 0.8), 0 0 80px rgba(255, 177, 153, 0.5);
        }
        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.98); opacity: 0.8; }
        }
        @keyframes pulse-fast {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.1); }
            100% { transform: scale(0.95); }
        }
        @keyframes pulse-speaking {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .status-text {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #a0aab0;
            text-align: center;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 140px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .message {
            margin-bottom: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .message.user { color: #4facfe; }
        .message.aura { color: #00f2fe; font-weight: 500; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #161b22;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-content h3 { margin-bottom: 15px; color: #00f2fe; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #a0aab0; }
        .form-group select, .form-group input {
            width: 100%;
            padding: 8px;
            background: #0d1117;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 5px;
        }
        .close-btn {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AURA</div>
        <button class="settings-btn" id="openSettings">Hang & Beállítások</button>
    </header>

    <div class="visualizer-container">
        <div class="aura-orb" id="orb"></div>
        <div class="status-text" id="status">Kattints a gömbre az indításhoz...</div>
    </div>

    <div class="chat-container" id="chat">
        <div class="message aura">AURA: Szia! Készen állok. Mondd, hogy "Nyisd meg a YouTube-ot"!</div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Beállítások</h3>
            <div class="form-group">
                <label for="voiceSelect">Női Hang kiválasztása:</label>
                <select id="voiceSelect"></select>
            </div>
            <div class="form-group">
                <label for="pitchRange">Hangmagasság (Lágyítás):</label>
                <input type="range" id="pitchRange" min="0.8" max="1.4" step="0.05" value="1.15">
            </div>
            <div class="form-group">
                <label for="rateRange">Beszédsebesség (Természetesség):</label>
                <input type="range" id="rateRange" min="0.7" max="1.2" step="0.05" value="0.95">
            </div>
            <button class="close-btn" id="closeSettings">Mentés és Bezárás</button>
        </div>
    </div>

    <script>
        const orb = document.getElementById('orb');
        const statusText = document.getElementById('status');
        const chat = document.getElementById('chat');
        const modal = document.getElementById('settingsModal');
        const openSettings = document.getElementById('openSettings');
        const closeSettings = document.getElementById('closeSettings');
        const voiceSelect = document.getElementById('voiceSelect');
        const pitchRange = document.getElementById('pitchRange');
        const rateRange = document.getElementById('rateRange');

        let isListening = false;
        let recognition = null;
        let synth = window.speechSynthesis;
        let voices = [];
        let autoRestart = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'hu-HU';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                orb.className = 'aura-orb listening';
                statusText.innerText = 'AURA figyel téged... Beszélj hozzá!';
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                addMessage('Tudatos', text, 'user');
                handleCommands(text);
            };

            recognition.onerror = (event) => {
                console.log('Felismerési hiba:', event.error);
                if (autoRestart && event.error !== 'not-allowed') {
                    setTimeout(() => { try{ recognition.start(); }catch(e){} }, 500);
                }
            };

            recognition.onend = () => {
                isListening = false;
                if (autoRestart && !synth.speaking) {
                    try { recognition.start(); } catch(e){}
                } else if (!synth.speaking) {
                    orb.className = 'aura-orb';
                    statusText.innerText = 'Kattints a gömbre a folytatáshoz...';
                }
            };
        } else {
            statusText.innerText = 'A böngésződ nem támogatja a beszéd-felismerést.';
        }

        function loadVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            
            const huVoices = voices.filter(v => v.lang.includes('hu'));
            if (huVoices.length > 0) {
                huVoices.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.innerText = `${v.name} (${v.lang})`;
                    if (v.name.includes('Noemi') || v.name.includes('Noémi') || v.name.includes('Google')) {
                        opt.selected = true;
                    }
                    voiceSelect.appendChild(opt);
                });
            } else {
                voices.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.innerText = `${v.name} (${v.lang})`;
                    voiceSelect.appendChild(opt);
                });
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        orb.addEventListener('click', () => {
            if (!recognition) return;
            autoRestart = true;
            if (synth.speaking) synth.cancel();

            try {
                recognition.start();
            } catch(e) {
                console.log('Már fut a felismerés...');
            }
        });

        // Parancsértelmező és végrehajtó motor
        function handleCommands(text) {
            const lower = text.toLowerCase();
            let reply = "";
            let actionUrl = null;

            if (lower.includes('youtube')) {
                reply = "Már nyitom is neked a YouTube-ot!";
                actionUrl = "https://www.youtube.com";
            } else if (lower.includes('google')) {
                reply = "Megnyitom a Google-t.";
                actionUrl = "https://www.google.com";
            } else if (lower.includes('facebook')) {
                reply = "Nyitom a Facebookot.";
                actionUrl = "https://www.facebook.com";
            } else if (lower.includes('index')) {
                reply = "Már hozom a híreket az Indexen.";
                actionUrl = "https://index.hu";
            } else if (lower.includes('szia') || lower.includes('üdv')) {
                reply = "Szia! Milyen oldalt vagy videót szeretnél, hogy megnyissak neked?";
            } else if (lower.includes('hogy vagy')) {
                reply = "Kiválóan! Készen állok, hogy irányítsam a böngésződet.";
            } else {
                reply = `Nem biztos, hogy megértettem a parancsot, de rákeresek: ${text}`;
                actionUrl = `https://www.google.com/search?q=${encodeURIComponent(text)}`;
            }

            speak(reply, actionUrl);
        }

        // Beszéd generálása + Opcionális ablaknyitás
        function speak(text, urlToOpen = null) {
            synth.cancel();
            orb.className = 'aura-orb speaking';
            statusText.innerText = 'AURA beszél és cselekszik...';

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hu-HU';
            utterance.pitch = parseFloat(pitchRange.value);
            utterance.rate = parseFloat(rateRange.value);

            const selectedVoiceName = voiceSelect.value;
            const selectedVoice = voices.find(v => v.name === selectedVoiceName);
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.onend = () => {
                addMessage('AURA', text, 'aura');
                
                // Ha van megnyitandó oldal, akkor a beszédfolyamat végén megnyitja!
                if (urlToOpen) {
                    window.open(urlToOpen, '_blank');
                }

                if (autoRestart) {
                    try { recognition.start(); } catch(e){}
                } else {
                    orb.className = 'aura-orb';
                    statusText.innerText = 'AURA figyel téged...';
                }
            };

            synth.speak(utterance);
        }

        function addMessage(sender, text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = `${sender}: ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        openSettings.onclick = () => modal.style.display = 'flex';
        closeSettings.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    </script>
</body>
</html>
