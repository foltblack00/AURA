<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA - Személyes AI Asszisztens</title>
    <!-- Puter AI SDK betöltése -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1e29 0%, #0a0c10 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0,242,254,0.5);
        }
        .settings-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.2); border-color: #00f2fe; }
        .visualizer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .aura-orb {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.8), 0 0 80px rgba(79, 172, 254, 0.4);
            animation: pulse 3s infinite ease-in-out;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .aura-orb.listening { animation: pulse-fast 1.2s infinite ease-in-out; box-shadow: 0 0 50px rgba(0, 242, 254, 1), 0 0 100px rgba(79, 172, 254, 0.8); }
        .aura-orb.thinking { animation: pulse-thinking 1s infinite ease-in-out; background: radial-gradient(circle, #a855f7 0%, #6366f1 100%); box-shadow: 0 0 50px rgba(168, 85, 247, 0.8), 0 0 100px rgba(99, 102, 241, 0.5); }
        .aura-orb.speaking { animation: pulse-speaking 0.8s infinite ease-in-out; background: radial-gradient(circle, #ff0844 0%, #ffb199 100%); box-shadow: 0 0 50px rgba(255, 8, 68, 0.8), 0 0 100px rgba(255, 177, 153, 0.5); }
        @keyframes pulse { 0% { transform: scale(0.98); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.98); opacity: 0.8; } }
        @keyframes pulse-fast { 0% { transform: scale(0.95); } 50% { transform: scale(1.1); } 100% { transform: scale(0.95); } }
        @keyframes pulse-thinking { 0% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 0.6; } }
        @keyframes pulse-speaking { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .status-text { margin-top: 30px; font-size: 1.2rem; color: #a0aab0; text-align: center; }
        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 160px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .message { margin-bottom: 10px; font-size: 0.95rem; line-height: 1.4; }
        .message.user { color: #4facfe; }
        .message.aura { color: #00f2fe; font-weight: 500; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #161b22;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-content h3 { margin-bottom: 15px; color: #00f2fe; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #a0aab0; }
        .form-group select, .form-group input {
            width: 100%; padding: 8px; background: #0d1117; border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 5px;
        }
        .close-btn { background: #00f2fe; color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">AURA</div>
        <button class="settings-btn" id="openSettings">Hang Beállítások</button>
    </header>

    <div class="visualizer-container">
        <div class="aura-orb" id="orb"></div>
        <div class="status-text" id="status">Kattints egyszer a gömbre az indításhoz...</div>
    </div>

    <div class="chat-container" id="chat">
        <div class="message aura">AURA: Rendszer online. Emlékszem a korábbi dolgokra, és tanulok abból, amit mondasz!</div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Rendszerbeállítások</h3>
            <div class="form-group">
                <label for="voiceSelect">Női hang kiválasztása:</label>
                <select id="voiceSelect"></select>
            </div>
            <div class="form-group">
                <label for="pitchRange">Hangmagasság:</label>
                <input type="range" id="pitchRange" min="0.8" max="1.4" step="0.05" value="1.15">
            </div>
            <div class="form-group">
                <label for="rateRange">Beszédsebesség:</label>
                <input type="range" id="rateRange" min="0.7" max="1.2" step="0.05" value="0.95">
            </div>
            <button class="close-btn" id="closeSettings">Mentés és Bezárás</button>
        </div>
    </div>

    <script>
        const orb = document.getElementById('orb');
        const statusText = document.getElementById('status');
        const chat = document.getElementById('chat');
        const modal = document.getElementById('settingsModal');
        const openSettings = document.getElementById('openSettings');
        const closeSettings = document.getElementById('closeSettings');
        const voiceSelect = document.getElementById('voiceSelect');
        const pitchRange = document.getElementById('pitchRange');
        const rateRange = document.getElementById('rateRange');

        let recognition = null;
        let synth = window.speechSynthesis;
        let voices = [];
        let isSessionActive = false;

        // Beállítások és hosszú távú memória betöltése a localStorage-ből
        if (localStorage.getItem('aura_pitch')) pitchRange.value = localStorage.getItem('aura_pitch');
        if (localStorage.getItem('aura_rate')) rateRange.value = localStorage.getItem('aura_rate');
        
        let learnedMemory = localStorage.getItem('aura_learned_memory') || "Még nincsenek elmentett egyedi adatok.";

        const BASE_PROMPT = "Te vagy AURA, egy intelligens, közvetlen és tanulékony AI asszisztens. Válaszolj magyarul, természetes, összefüggő mondatokban (2-3 mondatban).";

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false; // Visszaállítva biztonságos módra (nem vág bele a saját hangjába)
            recognition.lang = 'hu-HU';
            recognition.interimResults = false;

            recognition.onstart = () => {
                if (!synth.speaking) {
                    orb.className = 'aura-orb listening';
                    statusText.innerText = 'AURA hallgat... Beszélj most!';
                }
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript.trim();
                if (!text || text.length < 2) return;

                addMessage('Felhasználó', text, 'user');
                askRealAI(text);
            };

            recognition.onerror = (event) => {
                console.log('Felismerési hiba:', event.error);
                if (isSessionActive && !synth.speaking) {
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 500);
                }
            };

            recognition.onend = () => {
                // Csak akkor indul újra automatikusan a hallgatás, ha már befejezte a beszédet
                if (isSessionActive && !synth.speaking && !orb.classList.contains('thinking') && !orb.classList.contains('speaking')) {
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 300);
                } else if (!isSessionActive) {
                    orb.className = 'aura-orb';
                    statusText.innerText = 'Kattints egyszer a gömbre az indításhoz...';
                }
            };
        } else {
            statusText.innerText = 'A böngésző nem támogatja a beszédfelismerést.';
        }

        function loadVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            const savedVoice = localStorage.getItem('aura_voice');

            voices.forEach(v => {
                if (v.lang.includes('hu')) {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.innerText = `${v.name} (${v.lang})`;
                    
                    if (savedVoice && v.name === savedVoice) {
                        opt.selected = true;
                    } else if (!savedVoice && (v.name.toLowerCase().includes('noemi') || v.name.toLowerCase().includes('noémi') || v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('zsuzsa'))) {
                        opt.selected = true;
                    }
                    voiceSelect.appendChild(opt);
                }
            });

            if (voiceSelect.options.length === 0) {
                voices.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.innerText = `${v.name} (${v.lang})`;
                    voiceSelect.appendChild(opt);
                });
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        closeSettings.onclick = () => {
            modal.style.display = 'none';
            localStorage.setItem('aura_voice', voiceSelect.value);
            localStorage.setItem('aura_pitch', pitchRange.value);
            localStorage.setItem('aura_rate', rateRange.value);
        };

        orb.addEventListener('click', () => {
            if (!recognition) return;
            isSessionActive = true;
            if (synth.speaking) synth.cancel();
            try { 
                recognition.start(); 
            } catch(e) {
                console.log("Már fut a felismerő");
            }
        });

        async function askRealAI(userText) {
            orb.className = 'aura-orb thinking';
            statusText.innerText = 'AURA gondolkodik...';

            // Megvizsgáljuk, hogy a felhasználó akar-e tanítani valamit
            const lower = userText.toLowerCase();
            if (lower.includes('jegyezd meg') || lower.includes('emlékezz erre') || lower.includes('tanulj meg')) {
                learnedMemory += "\n- " + userText;
                localStorage.setItem('aura_learned_memory', learnedMemory);
                speak("Rögzítettem, Uram! Ezt a jövőben sem fogom elfelejteni.");
                return;
            }

            // Összeállítjuk a teljes kontextust, beleértve a hosszú távú memóriát és a webes parancsot is
            const fullPrompt = `${BASE_PROMPT}
            
            [Hosszú távú memória / Amit eddig megtanultam rólad]:
            ${learnedMemory}

            [Felhasználó aktuális kérése]: "${userText}"
            
            Ha a felhasználó weboldal megnyitását kéri (pl. YouTube, Google, Facebook), a válaszod végére illeszd be: [OPEN: https://webcim.com].`;

            try {
                const response = await puter.ai.chat(fullPrompt);
                let responseText = response.toString();

                let urlToOpen = null;
                const match = responseText.match(/\[OPEN:\s*(.*?)\]/);
                if (match) {
                    urlToOpen = match[1].trim();
                    responseText = responseText.replace(match[0], '').trim();
                }

                speak(responseText, urlToOpen);
            } catch (error) {
                console.error("AI Hiba:", error);
                speak("Elnézést, hiba történt a válaszadás közben.");
            }
        }

        function speak(text, urlToOpen = null) {
            synth.cancel();
            orb.className = 'aura-orb speaking';
            statusText.innerText = 'AURA beszél...';

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hu-HU';
            utterance.pitch = parseFloat(pitchRange.value);
            utterance.rate = parseFloat(rateRange.value);

            const selectedVoiceName = voiceSelect.value;
            const selectedVoice = voices.find(v => v.name === selectedVoiceName);
            if (selectedVoice) utterance.voice = selectedVoice;

            utterance.onend = () => {
                addMessage('AURA', text, 'aura');

                if (urlToOpen) {
                    window.open(urlToOpen, '_blank');
                }

                if (isSessionActive) {
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 400);
                }
            };

            synth.speak(utterance);
        }

        function addMessage(sender, text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = `${sender}: ${text}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        openSettings.onclick = () => modal.style.display = 'flex';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    </script>
</body>
</html>
